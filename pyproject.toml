[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvlab"
version = "0.2.5"
description = "CVLab - CV Experiment Management Platform"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "CVLab Contributors"}]
keywords = ["computer-vision", "experiment-management", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "opencv-python-headless>=4.8.0",
    "rich>=13.0.0",
]

[project.scripts]
cvlab = "cvlab.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/AlanAkillove/CVLab"
Repository = "https://github.com/AlanAkillove/CVLab"
Documentation = "https://github.com/AlanAkillove/CVLab#readme"

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cvlab*"]

# ── Ruff ──────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "T20", # flake8-print (warn on print())
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N802",   # function name should be lowercase
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "N999",   # module name not lowercase
    "T201",   # allow print() (CLI tool)
    # i18n: Chinese punctuation in docstrings/comments is intentional
    "RUF001", # ambiguous character (Chinese fullwidth punctuation)
    "RUF002", # ambiguous docstring (Chinese fullwidth punctuation)
    "RUF003", # ambiguous comment (Chinese fullwidth punctuation)
    # Intentional patterns
    "N812",   # lowercase import as non-lowercase (e.g. transforms as T)
    "UP037",  # quoted annotations (required for Python 3.10 compat)
    "E402",   # module-level import not at top (some LazyImports are intentional)
    "RUF022", # __all__ sorting
    "RUF059", # unpacked variable never used
]

[tool.ruff.lint.per-file-ignores]
"cvlab/tests/*.py" = ["T20", "ARG", "B011", "RUF005", "RUF043", "SIM108", "SIM105", "F841", "E741", "B007", "RUF012", "F401", "F821"]
"cvlab/cli/console.py" = ["T20"]
"cvlab/cli/compare.py" = ["E402", "F823"]
"cvlab/cli/help_.py" = ["F401"]  # rich imports used in _show_grouped_help

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── mypy ──────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_return_any = false
exclude = [
    "cvlab/tests/",
    "cvlab/__init__.py",
]

# ── pytest ────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["cvlab/tests"]
python_files = ["test_*.py"]
markers = [
    "slow: Testes que exigem execução longa (download de datasets, treino real)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

# ── Coverage ──────────────────────────────────────────────
[tool.coverage.run]
source = ["cvlab"]
omit = ["cvlab/tests/*"]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except Exception",
]
