#       type: choice
#       values: [sgd, adam, adamw]
#     training.batch_size:
#       type: int
#       range: [32, 256]

# 基础配置（所有 trial 共享）
model:
  name: resnet18
  pretrained: false
training:
  epochs: 30
  batch_size: 64
data:
  dataset_name: CIFAR10
  input_size: [3, 32, 32]
