# CVLab 超参扫描（Sweep）配置示例
# 用法: cvlab sweep create --config sweep.yaml

sweep:                       # 扫描参数定义（使用 sweep: 而非 _sweep）
  strategy: grid             # grid | random
  params:
    training.lr:
      values: [0.1, 0.01, 0.001]    # Grid: 枚举所有值
    training.optimizer:
      values: [sgd, adam]
    data.augment:
      values: [true, false]

# Random 搜索示例（取消下面的注释，注释掉上面 grid 部分）
# sweep:
